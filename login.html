<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso a la Plataforma</title>

<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="pantalla_completa.css">

<script src="modulo_conexion.js"></script>
<script src="pantalla_completa.js" defer></script>

</head>
<body>
  <div class="contenedor">
    <div class="marca">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="nombre">Syncro Suite</div>
    </div>

    <div class="tarjeta">
      <div id="vistaLogin">
        <h1>Iniciar sesion</h1>
        <p class="subtitulo">Introduce tus credenciales para acceder.</p>

        <div class="campo">
          <label for="txtUser">Usuario</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="txtUser" autocomplete="username" placeholder="tu usuario" />
          </div>
        </div>

        <div class="campo">
          <label for="txtPassword">Contrasena</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="txtPassword" autocomplete="current-password" placeholder="tu contrasena" />
            <button type="button" class="btn-ojo" id="btnOjo" aria-label="Mostrar contrasena">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="campo">
          <label for="txtCaptcha">Codigo de Seguridad:</label>
          <div class="input-wrap" style="gap: 10px; align-items: center;">
            <canvas id="canvasCaptcha" width="120" height="35" style="background: #e2e8f0; border-radius: 4px; border: 1px solid #cbd5e1;"></canvas>
            <input type="text" id="txtCaptcha" placeholder="Escribe el codigo" autocomplete="off" style="flex: 1;" />
          </div>
        </div>

        <button class="principal" id="btnEntrar">Entrar</button>
        <div class="mensaje" id="mensaje"></div>

        <div class="nota-seguridad">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>Por seguridad se registra la IP, hora y huella del equipo en cada acceso.</span>
        </div>
      </div>
    </div>

    <div class="pie">Acceso monitorizado</div>
  </div>
</body>
</html>
