<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reservar cita</title>
  <link rel="stylesheet" href="03_reservas.css">
</head>
<body>
  <main class="pub">

    <!-- ================= CABECERA: LOGOS ==================
         LOCAL PERSONALIZADO: edita aquí los logos directamente.
         - Cambia el src por la ruta/URL de tu imagen (ej. "logos/mi-logo.png").
         - Cambia el alt por el nombre real.
         - Si no quieres un logo, borra su bloque <div class="logo-slot">…</div>.
         - Puedes reemplazar la <img> por texto: <span class="logo-text">Mi Marca</span>
         Si la imagen no carga, su hueco se oculta solo. -->
    <header class="pub-top">
      <div class="logo-slot has" id="logo1">
        <img src="logos/logo1.png" alt="Logo"
             onerror="this.closest('.logo-slot').remove()">
      </div>
      <div class="logo-slot right has" id="logo2">
        <img src="logos/logo2.png" alt="Logo"
             onerror="this.closest('.logo-slot').remove()">
      </div>
    </header>

    <section class="pub-id">
      <div class="pub-name">
        <p class="eyebrow">Reserva online</p>
        <h1 id="titulo">Reservar cita</h1>
      </div>
      <a class="pub-phone" id="phone" hidden>
        <span class="pp-ico" aria-hidden="true">✆</span>
        <span class="pp-txt"><small>Contacto</small><b id="phoneNum"></b></span>
      </a>
    </section>

    <section class="card wizard" id="wizard">
      <!-- barra de progreso -->
      <div class="wz-bar">
        <button class="wz-back" id="wzBack" hidden aria-label="Volver">‹ Volver</button>
        <div class="wz-steps" id="wzSteps" aria-hidden="true"></div>
      </div>

      <div class="wz-crumbs" id="wzCrumbs" hidden></div>

      <div class="wz-stage" id="stage" aria-live="polite"></div>

      <p id="mensaje" class="message" role="status"></p>
      <div id="confirmacion" class="notice" hidden></div>
    </section>

    <details class="card cancel-box">
      <summary>
        <span class="cb-ico" aria-hidden="true">×</span>
        <span>¿Necesitas cancelar una cita?</span>
      </summary>
      <div class="cb-body">
        <div class="grid">
          <label class="field">Número de cita<input id="cancelId" inputmode="numeric" placeholder="Ej. 42"></label>
          <label class="field">Tu clave<input id="cancelClave" type="password" autocomplete="off"></label>
        </div>
        <div class="actions"><button class="btn danger" id="btnCancelar">Cancelar cita</button></div>
        <p id="cancelMsg" class="message" role="status"></p>
      </div>
    </details>

    <p class="pub-foot muted">Reservas seguras · No necesitas crear cuenta</p>
  </main>

  <script src="03_reservas.js"></script>
  <script>
  (function () {
    "use strict";
    var api = window.Reservas.api, esc = window.Reservas.esc;
    var $ = function (id) { return document.getElementById(id); };
    var q = new URLSearchParams(location.search);
    var slug = q.get("slug") || q.get("s") || "";
    var MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    var MES_CORTO = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

    var config = null;         // datos del local
    var tieneRoles = false;
    var estado = { anio: new Date().getFullYear(), mes: null, fecha: null, hora: null, personaId: null, personaNombre: null, rol: null, nombre: "", contacto: "", clave: "" };

    var PASOS = [];
    var idx = 0;

    function construirPasos() {
      PASOS = ["datos"];
      if (tieneRoles) PASOS.push("rol");
      PASOS.push("mes", "dia", "hora", "persona", "confirmar");
    }

    function msg(t, err) { var m = $("mensaje"); m.textContent = t || ""; m.className = "message" + (err ? " err" : ""); }
    function fechaISO() { return estado.anio + "-" + String(estado.mes).padStart(2, "0") + "-" + String(estado.fecha).padStart(2, "0"); }
    function fechaBonita() { return estado.fecha + " " + MES_CORTO[estado.mes - 1]; }

    function irA(n) {
      idx = Math.max(0, Math.min(n, PASOS.length - 1));
      render();
    }
    function siguiente() { irA(idx + 1); }
    function atras() { irA(idx - 1); }

    function invalidarDesde(paso) {
      var orden = PASOS.indexOf(paso);
      PASOS.forEach(function (p, i) {
        if (i <= orden) return;
        if (p === "mes") estado.mes = null;
        if (p === "dia") estado.fecha = null;
        if (p === "hora") estado.hora = null;
        if (p === "persona") { estado.personaId = null; estado.personaNombre = null; }
      });
    }

    function pintarProgreso() {
      var cont = $("wzSteps"); cont.innerHTML = "";
      for (var i = 0; i < PASOS.length; i++) {
        var s = document.createElement("span");
        s.className = "wz-dot" + (i === idx ? " on" : "") + (i < idx ? " done" : "");
        cont.appendChild(s);
      }
      $("wzBack").hidden = (idx === 0);
    }

    function pintarCrumbs() {
      var c = $("wzCrumbs"); var parts = [];
      if (estado.rol) parts.push(esc(estado.rol));
      if (estado.mes) parts.push(esc(fechaBonita()));
      if (estado.hora) parts.push(esc(estado.hora));
      if (estado.personaNombre) parts.push(esc(estado.personaNombre));
      if (!parts.length) { c.hidden = true; c.innerHTML = ""; return; }
      c.hidden = false;
      c.innerHTML = parts.map(function (p) { return '<span class="crumb">' + p + "</span>"; }).join('<span class="crumb-sep">›</span>');
    }

    function choicesHTML(items) {
      return '<div class="choices">' + items + "</div>";
    }

    function render() {
      msg("");
      pintarProgreso();
      pintarCrumbs();
      var paso = PASOS[idx];
      var stage = $("stage");

      if (paso === "datos") {
        stage.innerHTML =
          '<div class="wz-head"><h2>Tus datos</h2><p class="muted">Para avisarte de tu cita.</p></div>' +
          '<div class="grid">' +
            '<label class="field">Nombre<input id="f_nombre" autocomplete="name" placeholder="Tu nombre" value="' + esc(estado.nombre) + '"></label>' +
            '<label class="field">Teléfono o WhatsApp<input id="f_contacto" autocomplete="tel" inputmode="tel" placeholder="Para contactarte" value="' + esc(estado.contacto) + '"></label>' +
          '</div>' +
          '<div class="actions"><button class="btn primary big" id="f_next">Continuar ›</button></div>';
        $("f_next").addEventListener("click", function () {
          estado.nombre = $("f_nombre").value.trim();
          estado.contacto = $("f_contacto").value.trim();
          if (!estado.nombre) return msg("Escribe tu nombre para continuar.", true);
          siguiente();
        });
        return;
      }

      if (paso === "rol") {
        stage.innerHTML =
          '<div class="wz-head"><h2>¿Qué buscas?</h2><p class="muted">Elige el servicio o déjalo en cualquiera.</p></div>' +
          choicesHTML(
            '<button class="choice' + (estado.rol ? "" : " selected") + '" data-rol="">Cualquiera</button>' +
            (config.roles || []).map(function (r) {
              return '<button class="choice' + (estado.rol === r ? " selected" : "") + '" data-rol="' + esc(r) + '">' + esc(r) + "</button>";
            }).join("")
          );
        stage.querySelectorAll("[data-rol]").forEach(function (b) {
          b.addEventListener("click", function () {
            estado.rol = b.dataset.rol || null;
            invalidarDesde("rol");
            siguiente();
          });
        });
        return;
      }

      if (paso === "mes") {
        var hoy = new Date(), items = "";
        for (var i = 0; i < 12; i++) {
          var pasado = (estado.anio === hoy.getFullYear() && i < hoy.getMonth());
          items += '<button class="choice' + (estado.mes === i + 1 ? " selected" : "") + '" data-mes="' + (i + 1) + '"' + (pasado ? " disabled" : "") + '>' + MESES[i] + "</button>";
        }
        stage.innerHTML = '<div class="wz-head"><h2>Elige el mes</h2><p class="muted">' + esc(String(estado.anio)) + "</p></div>" + choicesHTML(items);
        stage.querySelectorAll("[data-mes]").forEach(function (b) {
          b.addEventListener("click", function () { estado.mes = Number(b.dataset.mes); invalidarDesde("mes"); cargarDias(); });
        });
        return;
      }

      if (paso === "dia") { cargarDias(); return; }
      if (paso === "hora") { cargarHoras(); return; }
      if (paso === "persona") { cargarPersonas(); return; }

      if (paso === "confirmar") {
        stage.innerHTML =
          '<div class="wz-head"><h2>Confirmar reserva</h2></div>' +
          '<div class="resumen">' +
            '<div><small>Fecha</small><b>' + esc(fechaBonita()) + " · " + esc(estado.anio) + "</b></div>" +
            '<div><small>Hora</small><b>' + esc(estado.hora) + "</b></div>" +
            '<div><small>Con</small><b>' + esc(estado.personaNombre || "") + "</b></div>" +
          "</div>" +
          '<label class="field" style="margin-top:14px">Crea una clave para cancelar después' +
            '<input id="f_clave" type="password" autocomplete="new-password" placeholder="mínimo 4 caracteres" value="' + esc(estado.clave) + '"></label>' +
          '<div class="actions"><button class="btn primary big" id="f_reservar">Reservar cita</button></div>';
        $("f_reservar").addEventListener("click", reservar);
        return;
      }
    }

    async function cargarDias() {
      var stage = $("stage");
      if (PASOS[idx] !== "dia") { idx = PASOS.indexOf("dia"); pintarProgreso(); pintarCrumbs(); }
      stage.innerHTML = '<div class="wz-head"><h2>Días disponibles</h2><p class="muted">' + esc(MESES[estado.mes - 1]) + "</p></div>" + '<p class="muted">Cargando días…</p>';
      try {
        var r = await api.diasMes(slug, estado.anio, estado.mes, estado.rol);
        var dias = r.dias || [];
        if (!dias.length) {
          stage.innerHTML = '<div class="wz-head"><h2>Días disponibles</h2></div>' +
            '<p class="muted">No hay días con cupo en ' + esc(MESES[estado.mes - 1]) + '.</p>' +
            '<div class="actions"><button class="btn" id="f_otromes">‹ Elegir otro mes</button></div>';
          $("f_otromes").addEventListener("click", function () { irA(PASOS.indexOf("mes")); });
          return;
        }
        stage.innerHTML = '<div class="wz-head"><h2>Días disponibles</h2><p class="muted">' + esc(MESES[estado.mes - 1]) + "</p></div>" +
          choicesHTML(dias.map(function (d) { return '<button class="choice' + (estado.fecha === d ? " selected" : "") + '" data-dia="' + d + '">' + d + "</button>"; }).join(""));
        stage.querySelectorAll("[data-dia]").forEach(function (b) {
          b.addEventListener("click", function () { estado.fecha = Number(b.dataset.dia); invalidarDesde("dia"); cargarHoras(); });
        });
      } catch (e) { stage.innerHTML = '<p class="message err">' + esc(e.message) + "</p>"; }
    }

    async function cargarHoras() {
      var stage = $("stage");
      if (PASOS[idx] !== "hora") { idx = PASOS.indexOf("hora"); pintarProgreso(); pintarCrumbs(); }
      stage.innerHTML = '<div class="wz-head"><h2>Horas disponibles</h2><p class="muted">' + esc(fechaBonita()) + "</p></div>" + '<p class="muted">Cargando horas…</p>';
      try {
        var r = await api.horasDia(slug, fechaISO(), estado.rol);
        var horas = r.horas || [];
        if (!horas.length) {
          stage.innerHTML = '<div class="wz-head"><h2>Horas disponibles</h2></div>' +
            '<p class="muted">Sin horas libres ese día.</p>' +
            '<div class="actions"><button class="btn" id="f_otrodia">‹ Elegir otro día</button></div>';
          $("f_otrodia").addEventListener("click", function () { irA(PASOS.indexOf("dia")); });
          return;
        }
        stage.innerHTML = '<div class="wz-head"><h2>Horas disponibles</h2><p class="muted">' + esc(fechaBonita()) + "</p></div>" +
          choicesHTML(horas.map(function (h) { return '<button class="choice' + (estado.hora === h ? " selected" : "") + '" data-hora="' + esc(h) + '">' + esc(h) + "</button>"; }).join(""));
        stage.querySelectorAll("[data-hora]").forEach(function (b) {
          b.addEventListener("click", function () { estado.hora = b.dataset.hora; invalidarDesde("hora"); cargarPersonas(); });
        });
      } catch (e) { stage.innerHTML = '<p class="message err">' + esc(e.message) + "</p>"; }
    }

    async function cargarPersonas() {
      var stage = $("stage");
      if (PASOS[idx] !== "persona") { idx = PASOS.indexOf("persona"); pintarProgreso(); pintarCrumbs(); }
      stage.innerHTML = '<div class="wz-head"><h2>¿Con quién?</h2><p class="muted">' + esc(fechaBonita()) + " · " + esc(estado.hora) + "</p></div>" + '<p class="muted">Buscando disponibles…</p>';
      try {
        var r = await api.personasSlot(slug, fechaISO(), estado.hora, estado.rol);
        var personas = r.personas || [];
        if (!personas.length) {
          stage.innerHTML = '<div class="wz-head"><h2>¿Con quién?</h2></div>' +
            '<p class="muted">Nadie libre a esa hora.</p>' +
            '<div class="actions"><button class="btn" id="f_otrahora">‹ Elegir otra hora</button></div>';
          $("f_otrahora").addEventListener("click", function () { irA(PASOS.indexOf("hora")); });
          return;
        }
        stage.innerHTML = '<div class="wz-head"><h2>¿Con quién?</h2><p class="muted">' + esc(fechaBonita()) + " · " + esc(estado.hora) + "</p></div>" +
          '<div class="persona-cards">' + personas.map(function (p) {
            return '<button class="persona-card' + (estado.personaId === p.id ? " selected" : "") + '" data-id="' + p.id + '" data-n="' + esc(p.nombre) + '">' +
              '<span class="pc-av" aria-hidden="true">' + esc((p.nombre || "?").trim().charAt(0).toUpperCase()) + "</span>" +
              '<span class="pc-info"><b>' + esc(p.nombre) + "</b>" + (p.rol ? "<small>" + esc(p.rol) + "</small>" : "") + "</span>" +
            "</button>";
          }).join("") + "</div>";
        stage.querySelectorAll("[data-id]").forEach(function (b) {
          b.addEventListener("click", function () {
            estado.personaId = Number(b.dataset.id); estado.personaNombre = b.dataset.n;
            siguiente();
          });
        });
      } catch (e) { stage.innerHTML = '<p class="message err">' + esc(e.message) + "</p>"; }
    }

    async function reservar() {
      estado.clave = $("f_clave").value;
      if (!estado.personaId) return msg("Completa los pasos anteriores.", true);
      if (estado.clave.length < 4) return msg("La clave debe tener al menos 4 caracteres.", true);
      var btn = $("f_reservar"); btn.disabled = true; msg("Reservando…");
      try {
        var r = await api.crearCita(slug, {
          persona_id: estado.personaId, fecha: fechaISO(), hora: estado.hora,
          nombre: estado.nombre, contacto: estado.contacto, clave_cancelacion: estado.clave,
        });
        $("stage").innerHTML = "";
        $("wzCrumbs").hidden = true; $("wzBack").hidden = true; $("wzSteps").innerHTML = "";
        $("confirmacion").hidden = false;
        $("confirmacion").innerHTML = "<strong>" + esc(r.mensaje) + "</strong>" +
          '<div class="muted" style="margin-top:8px">Tu número de cita (guárdalo para cancelar):</div>' +
          '<div class="clave-box">#' + esc(r.cita.id) + "</div>" +
          '<div class="actions"><button class="btn" id="f_otra">Reservar otra cita</button></div>';
        $("f_otra").addEventListener("click", function () { location.reload(); });
        msg("");
      } catch (e) { msg(e.message, true); btn.disabled = false; }
    }

    $("btnCancelar").addEventListener("click", async function () {
      var id = Number($("cancelId").value), clave = $("cancelClave").value, m = $("cancelMsg");
      if (!id || !clave) { m.textContent = "Escribe el número de cita y tu clave."; m.className = "message err"; return; }
      $("btnCancelar").disabled = true; m.textContent = "Cancelando…"; m.className = "message";
      try { var r = await api.cancelar(id, clave); m.textContent = r.mensaje; m.className = "message"; }
      catch (e) { m.textContent = e.message; m.className = "message err"; }
      $("btnCancelar").disabled = false;
    });

    $("wzBack").addEventListener("click", atras);

    async function iniciar() {
      if (!slug) { msg("Este enlace no identifica un negocio (falta ?slug=).", true); return; }
      try {
        var r = await api.config(slug);
        config = r.local;
        $("titulo").textContent = config.nombre;
        document.title = "Reservar · " + config.nombre;
        if (config.telefono) {
          $("phoneNum").textContent = config.telefono;
          $("phone").href = "tel:" + String(config.telefono).replace(/[^0-9+]/g, "");
          $("phone").hidden = false;
        }
        tieneRoles = !!(config.roles && config.roles.length);
      } catch (e) { msg(e.message, true); }
      construirPasos();
      irA(0);
    }
    iniciar();
  })();
  </script>
</body>
</html>
