<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú Principal</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: #f0f0f0;
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin: 0;
      padding-top: 100px;
    }
    h1 {
      color: #ffd700;
      margin-bottom: 50px;
    }
    .boton {
      display: inline-block;
      background-color: #2c2c2c;
      color: #f0f0f0;
      padding: 15px 30px;
      margin: 20px;
      border-radius: 8px;
      font-size: 20px;
      text-decoration: none;
      box-shadow: 0 0 10px #000;
      transition: background 0.3s;
    }
    .boton:hover {
      background-color: #3a3a3a;
    }
    .contenedor-imagen {
      margin: 30px auto;
      max-width: 80%; /* Ajusta el ancho máximo */
    }
    .contenedor-imagen img {
      width: 100%;
      height: auto;
      border-radius: 10px; /* Opcional: bordes redondeados */
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h1>Menú Principal</h1>
  <a href="controles.html" class="boton">Controles</a>
  <a href="creditos.html" class="boton">Créditos</a>
  <div class="contenedor-imagen">
    <img src="v1.3_.png" alt="Descripción">
  </div>
</body>
</html>
